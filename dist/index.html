
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/dist/public/img/Pixelated _Orange sphere with soft shading and a red star in the center, inspired by classic Dragon.jpeg" type="image/x-icon">
    <title>DRAGON BALL GAME</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
      
        body {
            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.20),
                    rgba(0, 0, 0, 0.20)
                ),
                url('/dist/public/img/Esenario.jpeg');

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            background-color: #222;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            margin: 0;
        }

      
        h1 {
            color: #e421da !important;
            text-shadow:
                2px 2px 4px rgba(129, 249, 249, 0.9),
                0 0 15px rgba(255, 255, 255, 0.7);
            letter-spacing: 2px;
        }

        .game-panel {
            background: rgba(143, 222, 191, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(255, 252, 252, 0.896);
        }

       
        #py1 img,
        #py2 img {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }

        #py1 img:hover {
            transform: scale(1.10);
            box-shadow: 0 0 15px #c23613, 0 0 25px #fdb381 !important;
        }

        #py2 img:hover {
            transform: scale(1.10);
            box-shadow: 0 0 15px #00d2ff, 0 0 25px #0066ff !important;
        }

        
        .form-control {
            background-color: rgba(249, 249, 249, 0.85) !important;
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            color: #fff !important;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .form-control:focus {
            background-color: rgba(234, 234, 241, 0.95) !important;
            color: #fff !important;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.4) !important;
        }

        /* Etiquetas de los jugadores */
        .form-floating label {
            color: #ffffff;
        }

        
        button {
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        button:hover {
            filter: brightness(1.12);
            transform: translateY(-2px);
        }

        #tarjetas > div {
            background: rgba(244, 244, 252, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

       
        .progress {
            height: 22px;
        }

       
        @media (max-width: 768px) {
            body {
                background-attachment: scroll;
            }

            h1 {
                font-size: 2rem;
                letter-spacing: 1px;
            }

            .game-panel {
                margin-bottom: 20px;
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="container my-4">

        <!-- Título -->
        <div class="row justify-content-center">
            <div class="col text-center">
                <h1 class="display-3 fw-bold">
                    <i class="fa-solid fa-dragon"></i>
                    DRAGON BALL GAME
                    <i class="fa-solid fa-dragon"></i>
                </h1>
            </div>
        </div>

        <!-- Nombres de los jugadores -->
        <div id="nombres" class="row justify-content-around mt-4">

            <div class="col-md-5">
                <div class="form-floating border border-danger rounded mb-3 bg-dark">
                    <input
                        type="text"
                        id="player1"
                        class="form-control"
                        placeholder="Jugador 1"
                    >
                    <label class="text-danger fw-bold" for="player1">
                        <i class="fa-solid fa-user me-2"></i>
                        Jugador 1
                    </label>
                </div>
            </div>

            <div class="col-md-5">
                <div class="form-floating border border-primary rounded mb-3 bg-dark">
                    <input
                        type="text"
                        id="player2"
                        class="form-control"
                        placeholder="Jugador 2"
                    >
                    <label class="text-primary fw-bold" for="player2">
                        <i class="fa-solid fa-user me-2"></i>
                        Jugador 2
                    </label>
                </div>
            </div>

        </div>

        <!-- Selección de personajes -->
        <div class="row justify-content-around mt-3">

            <!-- Jugador 1 -->
            <div id="py1" class="col-md-5 text-center game-panel border border-danger">

                <p class="text-danger fw-bold fs-5">
                    Seleccionar personaje
                </p>

                <div class="row mt-3 g-2">
                    <div class="col-3">
                        <img
                            class="img-fluid rounded-circle bg-danger border border-danger shadow"
                            src="./public/img/seleccion/01.png"
                            alt="Vegitto"
                        >
                    </div>

                    <div class="col-3">
                        <img
                            class="img-fluid rounded-circle bg-danger border border-danger shadow"
                            src="./public/img/seleccion/03.png"
                            alt="Trunks"
                        >
                    </div>

                    <div class="col-3">
                        <img
                            class="img-fluid rounded-circle bg-danger border border-danger shadow"
                            src="./public/img/seleccion/06.png"
                            alt="Gohan"
                        >
                    </div>

                    <div class="col-3">
                        <img
                            class="img-fluid rounded-circle bg-danger border border-danger shadow"
                            src="./public/img/seleccion/05.png"
                            alt="Goku"
                        >
                    </div>
                </div>

                <button
                    id="btn_player1"
                    type="button"
                    class="btn btn-danger w-100 mt-4 fw-bold shadow"
                >
                    Aceptar
                    <i class="fa-solid fa-gamepad"></i>
                </button>

            </div>

            <!-- Jugador 2 -->
            <div id="py2" class="col-md-5 text-center game-panel border border-primary">

                <p class="text-primary fw-bold fs-5">
                    Seleccionar personaje
                </p>

                <div class="row mt-3 g-2">
                    <div class="col-3">
                        <img
                            class="img-fluid rounded-circle bg-primary border border-primary shadow"
                            src="./public/img/seleccion/02.png"
                            alt="Vegeta"
                        >
                    </div>

                    <div class="col-3">
                        <img
                            class="img-fluid rounded-circle bg-primary border border-primary shadow"
                            src="./public/img/seleccion/08.png"
                            alt="Cell"
                        >
                    </div>

                    <div class="col-3">
                        <img
                            class="img-fluid rounded-circle bg-primary border border-primary shadow"
                            src="./public/img/seleccion/04.png"
                            alt="Piccolo"
                        >
                    </div>

                    <div class="col-3">
                        <img
                            class="img-fluid rounded-circle bg-primary border border-primary shadow"
                            src="./public/img/seleccion/07.png"
                            alt="Gogeta"
                        >
                    </div>
                </div>

                <button
                    id="btn_player2"
                    type="button"
                    class="btn btn-primary w-100 mt-4 fw-bold shadow"
                >
                    Aceptar
                    <i class="fa-solid fa-gamepad"></i>
                </button>

            </div>

        </div>

        <!-- Tarjetas de combate -->
        <div id="tarjetas" class="row justify-content-between mt-5 d-none">

            <!-- Estadísticas del jugador 1 -->
            <div class="col-md-5 border border-danger rounded p-4 game-panel mb-4 shadow-lg">

                <h2 id="username1" class="text-danger h4 fw-bold">
                    Jugador 1
                </h2>

                <p id="personaje1" class="lead fs-5 text-light">
                    Personaje
                </p>

                <img
                    id="img1"
                    src=""
                    class="img-fluid d-block mx-auto mb-3"
                    style="max-height: 150px;"
                    alt=""
                >

                <label for="vida1" class="text-success fw-bold">Vida</label>
                <div class="progress mb-2 bg-secondary" role="progressbar">
                    <div id="vida1" class="progress-bar bg-success" style="width: 100%">
                        100%
                    </div>
                </div>

                <label for="ki1" class="text-warning fw-bold">Ki</label>
                <div class="progress mb-2 bg-secondary" role="progressbar">
                    <div id="ki1" class="progress-bar bg-warning text-dark fw-bold" style="width: 100%">
                        100%
                    </div>
                </div>

                <label for="energia1" class="text-info fw-bold">Energía</label>
                <div class="progress mb-3 bg-secondary" role="progressbar">
                    <div id="energia1" class="progress-bar bg-info" style="width: 100%">
                        100%
                    </div>
                </div>

                <hr class="border-secondary">

                <div id="btn_py1" class="row g-2">
                    <div class="col-6 col-sm-3">
                        <button class="btn btn-warning w-100 btn-sm fw-bold">
                            Ataque básico
                        </button>
                    </div>

                    <div class="col-6 col-sm-3">
                        <button class="btn btn-danger w-100 btn-sm fw-bold">
                            Ataque especial
                        </button>
                    </div>

                    <div class="col-6 col-sm-3">
                        <button class="btn btn-info w-100 btn-sm text-white fw-bold">
                            Cargar Ki
                        </button>
                    </div>

                    <div class="col-6 col-sm-3">
                        <button class="btn btn-success w-100 btn-sm fw-bold">
                            Semilla <span class="badge bg-dark">2</span>
                        </button>
                    </div>
                </div>

            </div>

            <!-- Estadísticas del jugador 2 -->
            <div class="col-md-5 border border-primary rounded p-4 game-panel mb-4 shadow-lg">

                <h2 id="username2" class="text-primary h4 fw-bold">
                    Jugador 2
                </h2>

                <p id="personaje2" class="lead fs-5 text-light">
                    Personaje
                </p>

                <img
                    id="img2"
                    src=""
                    class="img-fluid d-block mx-auto mb-3"
                    style="max-height: 150px;"
                    alt=""
                >

                <label for="vida2" class="text-success fw-bold">Vida</label>
                <div class="progress mb-2 bg-secondary" role="progressbar">
                    <div id="vida2" class="progress-bar bg-success" style="width: 100%">
                        100%
                    </div>
                </div>

                <label for="ki2" class="text-warning fw-bold">Ki</label>
                <div class="progress mb-2 bg-secondary" role="progressbar">
                    <div id="ki2" class="progress-bar bg-warning text-dark fw-bold" style="width: 100%">
                        100%
                    </div>
                </div>

                <label for="energia2" class="text-info fw-bold">Energía</label>
                <div class="progress mb-3 bg-secondary" role="progressbar">
                    <div id="energia2" class="progress-bar bg-info" style="width: 100%">
                        100%
                    </div>
                </div>

                <hr class="border-secondary">

                <div id="btn_py2" class="row g-2">
                    <div class="col-6 col-sm-3">
                        <button class="btn btn-warning w-100 btn-sm fw-bold">
                            Ataque básico
                        </button>
                    </div>

                    <div class="col-6 col-sm-3">
                        <button class="btn btn-danger w-100 btn-sm fw-bold">
                            Ataque especial
                        </button>
                    </div>

                    <div class="col-6 col-sm-3">
                        <button class="btn btn-info w-100 btn-sm text-white fw-bold">
                            Cargar Ki
                        </button>
                    </div>

                    <div class="col-6 col-sm-3">
                        <button class="btn btn-success w-100 btn-sm fw-bold">
                            Semilla <span class="badge bg-dark">2</span>
                        </button>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <!-- JavaScript original del juego -->
    <script src="./bundle.js"></script>

</body>
</html>
